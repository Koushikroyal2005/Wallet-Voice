services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiwallet_test
      POSTGRES_USER: aiwallet_test
      POSTGRES_PASSWORD: aiwallet_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwallet_test -d aiwallet_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs: [/var/lib/postgresql/data]
  test:
    build: ./backend
    command: ["sh", "-c", "alembic -c alembic.ini upgrade head && pytest -q tests/integration"]
    environment:
      DATABASE_URL: postgresql+psycopg://aiwallet_test:aiwallet_test@test-db:5432/aiwallet_test
      TEST_DATABASE_URL: postgresql+psycopg://aiwallet_test:aiwallet_test@test-db:5432/aiwallet_test
    depends_on:
      test-db: { condition: service_healthy }
    profiles: [test]
